name: Share my FLEX profile
description: Make your FLEX profile (display name, picture, name style, title) show for other FLEX players.
title: "My FLEX profile"
labels: ["flex-card"]
body:
  - type: markdown
    attributes:
      value: |
        FLEX copied your profile card when you clicked **Make my profile public**. Paste it below and submit.
        Other FLEX players see it on their own screen only. Close this issue any time to take your profile down.
  - type: textarea
    id: card
    attributes:
      label: Profile card
      description: Paste with Ctrl+V. It starts with {"format":"rl-profile-card"
      render: json
    validations:
      required: true
